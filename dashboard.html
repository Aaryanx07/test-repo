<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f5fb;
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{

            width:240px;
            background:white;

            padding:30px 25px;

            display:flex;
            flex-direction:column;
            justify-content:space-between;

            box-shadow:0 0 15px rgba(0,0,0,0.05);
        }

        .top-sidebar{

            display:flex;
            flex-direction:column;
        }

        .logo{

            font-size:32px;
            font-weight:800;

            color:#2f63ea;

            margin-bottom:60px;
        }

        .menu{

            display:flex;
            flex-direction:column;
            gap:28px;
        }

        .menu a{

            text-decoration:none;

            color:#111;

            font-size:20px;
            font-weight:600;

            transition:0.2s;
        }

        .menu a:hover{

            color:#2f63ea;
            transform:translateX(5px);
        }

        .logout-btn{

            background:#ff4b4b;
            color:white;

            border:none;

            padding:16px;

            border-radius:14px;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .logout-btn:hover{

            background:#e03131;
        }

        /* MAIN */

        .main{

            flex:1;
            padding:30px;
        }

        /* TOPBAR */

        .topbar{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:35px;
        }

        .search-bar{

            width:70%;

            display:flex;
            gap:15px;
        }

        .search-bar input{

            flex:1;

            padding:18px 24px;

            border:none;
            outline:none;

            border-radius:16px;

            font-size:20px;

            background:white;
        }

        .search-bar button{

            background:#2f63ea;
            color:white;

            border:none;

            padding:0 30px;

            border-radius:16px;

            font-size:20px;

            cursor:pointer;

            transition:0.3s;
        }

        .search-bar button:hover{

            background:#1d4ed8;
        }

        .profile{

            width:70px;
            height:70px;

            border-radius:50%;

            object-fit:cover;
        }

        /* WELCOME */

        .welcome-card{

            background:white;

            border-radius:28px;

            padding:45px;

            margin-bottom:35px;

            box-shadow:0 0 15px rgba(0,0,0,0.04);
        }

        .welcome-card h1{

            font-size:64px;

            margin-bottom:15px;
        }

        .welcome-card p{

            font-size:24px;
            color:#666;
        }

        /* CATEGORY GRID */

        .categories{

            display:grid;

            grid-template-columns:
            repeat(4,1fr);

            gap:25px;
        }

        .category-card{

            background:white;

            border-radius:24px;

            padding:30px;

            text-align:center;

            cursor:pointer;

            transition:0.3s;

            text-decoration:none;

            color:black;

            box-shadow:0 0 15px rgba(0,0,0,0.04);
        }

        .category-card:hover{

            transform:translateY(-6px);
        }

        .category-card img{

            width:70px;
            height:70px;

            object-fit:contain;

            margin-bottom:18px;
        }

        .category-card h2{

            font-size:26px;
        }

        /* RESPONSIVE */

        @media(max-width:1200px){

            .categories{

                grid-template-columns:
                repeat(2,1fr);
            }
        }

        @media(max-width:800px){

            body{

                flex-direction:column;
            }

            .sidebar{

                width:100%;
                height:auto;
            }

            .categories{

                grid-template-columns:1fr;
            }

            .welcome-card h1{

                font-size:42px;
            }

            .search-bar{

                width:100%;
            }
        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="top-sidebar">

            <div class="logo">

                PriceCompare

            </div>

            <div class="menu">

                <a href="./dashboard.html">
                    Dashboard
                </a>

                <a href="./review-checker.html">
                    Review Checker
                </a>

                <a href="./wishlist.html">
                    Wishlist
                </a>

                <a href="./alerts.html">
                    Alerts
                </a>

                <a href="./profile.html">
                    Profile
                </a>

            </div>

        </div>

     <button
        class="logout-btn"
        onclick="window.location.href='index.html'"
    >

        Logout

    </button>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOPBAR -->

        <div class="topbar">

            <div class="search-bar">

                <input
                type="text"
                id="productUrl"
                placeholder="Paste Amazon / Flipkart product URL..."
                >

                <button id="searchBtn">

                    Search

                </button>

            </div>

            <img
            src="https://i.pravatar.cc/150?img=12"
            class="profile"
            >

        </div>

        <!-- WELCOME -->

        <div class="welcome-card">

            <h1>
                Welcome Back 👋
            </h1>

            <p>
                Compare prices across websites instantly.
            </p>

        </div>

        <!-- CATEGORIES -->

        <div class="categories">

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=electronics"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/1041/1041886.png"
                >

                <h2>
                    Electronics
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=fashion"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/892/892458.png"
                >

                <h2>
                    Fashion
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=sports"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/857/857455.png"
                >

                <h2>
                    Sports
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=gaming"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/686/686589.png"
                >

                <h2>
                    Gaming
                </h2>

            </a>

        </div>

    </div>

    <!-- SEARCH SCRIPT -->

    <script>

        const searchBtn =
        document.getElementById("searchBtn");

        const productUrl =
        document.getElementById("productUrl");

        searchBtn.addEventListener("click", ()=>{

            const url =
            productUrl.value.trim();

            if(!url){

                alert("Please paste a product URL");

                return;
            }

            window.location.href =

            `search-results.html?url=${encodeURIComponent(url)}`;
        });

        productUrl.addEventListener("keypress",(e)=>{

            if(e.key === "Enter"){

                searchBtn.click();
            }
        });

    </script>

</body>

</html>
