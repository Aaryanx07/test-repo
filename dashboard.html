<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f5fb;
            display:flex;
            min-height:100vh;
        }

        /* SIDEBAR */

        .sidebar{

            width:240px;
            background:white;

            padding:30px 25px;

            display:flex;
            flex-direction:column;
            justify-content:space-between;

            box-shadow:0 0 15px rgba(0,0,0,0.05);

            position:fixed;

            left:0;
            top:0;

            height:100vh;

            z-index:100;
        }

        .top-sidebar{

            display:flex;
            flex-direction:column;
        }

        .logo{

            font-size:32px;
            font-weight:800;

            color:#2f63ea;

            margin-bottom:60px;
        }

        .menu{

            display:flex;
            flex-direction:column;
            gap:28px;
        }

        .menu a{

            text-decoration:none;

            color:#111;

            font-size:20px;
            font-weight:600;

            transition:0.2s;
        }

        .menu a:hover{

            color:#2f63ea;
            transform:translateX(5px);
        }

        .logout-btn{

            background:#ff4b4b;
            color:white;

            border:none;

            padding:16px;

            border-radius:14px;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .logout-btn:hover{

            background:#e03131;
        }

        /* MAIN */

        .main{

            flex:1;

            padding:30px;

            margin-left:240px;
        }

        /* TOPBAR */

        .topbar{

            display:flex;
            justify-content:space-between;
            align-items:flex-start;

            margin-bottom:35px;
        }

        /* SEARCH BAR */

        .search-bar{

            width:70%;

            display:flex;
            gap:15px;

            align-items:flex-start;

            position:relative;
        }

        .search-input-wrapper{

            position:relative;

            flex:1;
        }

        .search-bar input{

            width:100%;

            padding:18px 24px;

            border:none;
            outline:none;

            border-radius:16px;

            font-size:20px;

            background:white;

            position:relative;

            z-index:10;
        }

        .search-bar button{

            background:#2f63ea;
            color:white;

            border:none;

            padding:0 30px;

            border-radius:16px;

            font-size:20px;

            cursor:pointer;

            transition:0.3s;

            height:64px;

            position:relative;

            z-index:10;
        }

        .search-bar button:hover{

            background:#1d4ed8;
        }

        /* MIC BUTTON */

        .mic-btn{

            width:70px;

            border:none;

            background:#111827;

            color:white;

            border-radius:16px;

            font-size:28px;

            cursor:pointer;

            transition:0.3s;
        }

        .mic-btn:hover{

            background:#2f63ea;
        }

        .mic-btn.listening{

            background:#ef4444;

            animation:pulse 1s infinite;
        }

        @keyframes pulse{

            0%{

                transform:scale(1);
            }

            50%{

                transform:scale(1.08);
            }

            100%{

                transform:scale(1);
            }
        }

        /* LISTENING TEXT */

        .listening-text{

            position:absolute;

            bottom:-38px;
            left:10px;

            font-size:16px;
            font-weight:600;

            color:#ef4444;

            display:none;
        }

        /* PROFILE */

        .profile{

            width:70px;
            height:70px;

            border-radius:50%;

            object-fit:cover;
        }

        /* WELCOME */

        .welcome-card{

            background:white;

            border-radius:28px;

            padding:45px;

            margin-bottom:35px;

            box-shadow:0 0 15px rgba(0,0,0,0.04);
        }

        .welcome-card h1{

            font-size:64px;

            margin-bottom:15px;
        }

        .welcome-card p{

            font-size:24px;
            color:#666;
        }

        /* CATEGORY GRID */

        .categories{

            display:grid;

            grid-template-columns:
            repeat(4,1fr);

            gap:25px;
        }

        .category-card{

            background:white;

            border-radius:24px;

            padding:30px;

            text-align:center;

            cursor:pointer;

            transition:0.3s;

            text-decoration:none;

            color:black;

            box-shadow:0 0 15px rgba(0,0,0,0.04);
        }

        .category-card:hover{

            transform:translateY(-6px);
        }

        .category-card img{

            width:70px;
            height:70px;

            object-fit:contain;

            margin-bottom:18px;
        }

        .category-card h2{

            font-size:26px;
        }

        /* GOOGLE STYLE AUTOCOMPLETE */

        .suggestions-box{

            position:absolute;

            top:74px;

            left:0;

            width:100%;

            background:white;

            border-radius:18px;

            overflow:hidden;

            box-shadow:
            0 8px 30px rgba(0,0,0,0.08);

            border:1px solid #ececec;

            z-index:9999;

            display:none;
        }

        .suggestion-item{

            padding:16px 22px;

            font-size:18px;

            color:#111827;

            cursor:pointer;

            transition:0.2s;

            border-bottom:
            1px solid #f3f4f6;

            display:flex;

            align-items:center;

            gap:12px;
        }

        .suggestion-item:last-child{

            border-bottom:none;
        }

        .suggestion-item:hover{

            background:#f5f7ff;
        }

        .suggestion-item::before{

            content:"🔍";

            font-size:15px;

            opacity:0.7;
        }

        /* RESPONSIVE */

        @media(max-width:1200px){

            .categories{

                grid-template-columns:
                repeat(2,1fr);
            }
        }

        @media(max-width:800px){

            body{

                flex-direction:column;
            }

            .sidebar{

                width:100%;
                height:auto;

                position:relative;
            }

            .main{

                margin-left:0;
            }

            .categories{

                grid-template-columns:1fr;
            }

            .welcome-card h1{

                font-size:42px;
            }

            .search-bar{

                width:100%;
            }
        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="top-sidebar">

            <div class="logo">

                JerseyScout

            </div>

            <div class="menu">

                <a href="./dashboard.html">
                    Dashboard
                </a>

                <a href="./review-checker.html">
                    Review Checker
                </a>

                <a href="./wishlist.html">
                    Wishlist
                </a>

                <a href="./profile.html">
                    Profile
                </a>

            </div>

        </div>

<button
class="logout-btn"
onclick="logout()"
>

    Logout

</button>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOPBAR -->

        <div class="topbar">

            <div class="search-bar">

                <div class="search-input-wrapper">

                    <input
                    type="text"
                    id="productUrl"
                    placeholder="Paste Amazon / Flipkart product URL..."
                    >

                </div>

                <!-- MIC -->

                <button
                class="mic-btn"
                id="micBtn"
                >

                    🎤

                </button>

                <!-- SEARCH -->

                <button id="searchBtn">

                    Search

                </button>

                <!-- LISTENING -->

                <div
                class="listening-text"
                id="listeningText"
                >

                    Listening...

                </div>

            </div>

            <img
            src="https://i.pravatar.cc/150?img=12"
            class="profile"
            >

        </div>

        <!-- WELCOME -->

        <div class="welcome-card">

            <h1>
                Welcome Back 👋
            </h1>

            <p>
                Compare prices across websites instantly.
            </p>

        </div>

        <!-- CATEGORIES -->

        <div class="categories">

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=electronics"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/1041/1041886.png"
                >

                <h2>
                    Electronics
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=fashion"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/892/892458.png"
                >

                <h2>
                    Fashion
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=sports"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/857/857455.png"
                >

                <h2>
                    Sports
                </h2>

            </a>

            <a
            class="category-card"
            href="https://www.amazon.in/s?k=gaming"
            target="_blank"
            >

                <img
                src="https://cdn-icons-png.flaticon.com/512/686/686589.png"
                >

                <h2>
                    Gaming
                </h2>

            </a>

        </div>

    </div>

<script>

const token =

localStorage.getItem(
    "token"
);

if(!token){

    window.location.href =
    "login.html";
}

const searchInput =
document.getElementById(
    "productUrl"
);

const searchBtn =
document.getElementById(
    "searchBtn"
);

const micBtn =
document.getElementById(
    "micBtn"
);

const listeningText =
document.getElementById(
    "listeningText"
);
function logout(){

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href =
    "login.html";
}
/* =========================
   AUTOCOMPLETE
========================= */

const suggestionsBox =
document.createElement("div");

suggestionsBox.className =
"suggestions-box";

document
.querySelector(".search-input-wrapper")
.appendChild(suggestionsBox);

const suggestions = [

    "iphone",

    "iphone 17 pro max",

    "iphone XR",

    "Macbook Air M3",

    "PS5",

    "Nike shoes",

    "Gaming mouse",

    "Protein powder",

    "Basketball",

    "Wireless headphones",

    "Mechanical keyboard",

    "Samsung S24 Ultra",

    "Airpods Pro",

    "Football studs",

    "Gaming keyboard",

    "OnePlus 12",

    "JBL speaker"
];

/* =========================
   RENDER SUGGESTIONS
========================= */

function renderSuggestions(filtered){

    suggestionsBox.innerHTML =
    "";

    filtered.forEach(item=>{

        const div =
        document.createElement("div");

        div.className =
        "suggestion-item";

        div.innerHTML =
        `<span>${item}</span>`;

        div.addEventListener(

            "click",

            ()=>{

                searchInput.value =
                item;

                suggestionsBox.style.display =
                "none";
            }
        );

        suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display =

    filtered.length
    ? "block"
    : "none";
}

/* =========================
   DEFAULT SUGGESTIONS
========================= */

searchInput.addEventListener(

    "focus",

    ()=>{

        renderSuggestions(

            suggestions.slice(0,8)
        );
    }
);

/* =========================
   FILTER
========================= */

searchInput.addEventListener(

    "input",

    ()=>{

        const value =

        searchInput.value
        .toLowerCase()
        .trim();

        if(!value){

            renderSuggestions(

                suggestions.slice(0,8)
            );

            return;
        }

        const filtered =

        suggestions.filter(item=>

            item
            .toLowerCase()
            .includes(value)
        );

        renderSuggestions(filtered);
    }
);

/* =========================
   HIDE
========================= */

document.addEventListener(

    "click",

    (e)=>{

        if(

            !e.target.closest(
                ".search-input-wrapper"
            )

        ){

            suggestionsBox.style.display =
            "none";
        }
    }
);

/* =========================
   SEARCH
========================= */

searchBtn.addEventListener(

    "click",

    ()=>{

        const query =
        searchInput.value.trim();

        if(!query){

            alert(
                "Please enter a product"
            );

            return;
        }

        window.location.href =

        `search-results.html?url=${encodeURIComponent(query)}`;
    }
);

/* =========================
   ENTER SEARCH
========================= */

searchInput.addEventListener(

    "keypress",

    (e)=>{

        if(e.key === "Enter"){

            searchBtn.click();
        }
    }
);

/* =========================
   VOICE SEARCH WORKING
========================= */

const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
    new SpeechRecognition();

    recognition.lang =
    "en-US";

    recognition.continuous =
    true;

    recognition.interimResults =
    true;

    let isListening =
    false;

    let finalTranscript =
    "";

/* =========================
   MIC CLICK
========================= */

    micBtn.addEventListener(

        "click",

        async()=>{

            /* STOP */

            if(isListening){

                isListening =
                false;

                recognition.stop();

                return;
            }

            try{

                await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true
                });

                finalTranscript =
                "";

                recognition.start();

                isListening =
                true;

                micBtn.classList.add(
                    "listening"
                );

                micBtn.innerHTML =
                "🎙️";

                listeningText.style.display =
                "block";

                listeningText.innerText =
                "Listening...";
            }

            catch(error){

                console.log(error);

                alert(
                    "Please allow microphone access"
                );
            }
        }
    );

/* =========================
   RESULTS
========================= */

    recognition.onresult =
    (event)=>{

        let interimTranscript =
        "";

        for(

            let i =
            event.resultIndex;

            i <
            event.results.length;

            i++
        ){

            const transcript =

            event.results[i][0]
            .transcript;

            if(

                event.results[i]
                .isFinal

            ){

                finalTranscript +=
                transcript + " ";
            }

            else{

                interimTranscript +=
                transcript;
            }
        }

        /* UPDATE INPUT */

        searchInput.value =

        finalTranscript +
        interimTranscript;

        /* UPDATE SUGGESTIONS */

        const filtered =

        suggestions.filter(item=>

            item
            .toLowerCase()
            .includes(

                searchInput.value
                .toLowerCase()
            )
        );

        renderSuggestions(filtered);
    };

/* =========================
   KEEP LISTENING
========================= */

    recognition.onend =
    ()=>{

        if(isListening){

            recognition.start();
        }

        else{

            micBtn.classList.remove(
                "listening"
            );

            micBtn.innerHTML =
            "🎤";

            listeningText.style.display =
            "none";
        }
    };

/* =========================
   ERRORS
========================= */

    recognition.onerror =
    (event)=>{

        console.log(
            "VOICE ERROR:",
            event.error
        );

        if(

            event.error ===
            "not-allowed"

        ){

            alert(
                "Please allow microphone access"
            );

            isListening =
            false;
        }
    };
}

else{

    micBtn.style.display =
    "none";

    console.log(
        "Speech recognition not supported"
    );
}

</script>

</body>

</html>
