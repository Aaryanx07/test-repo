<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Search Results
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f5fb;

            padding:40px;
        }

        /* TOP */

        .top-bar{

            display:flex;
            justify-content:space-between;
            align-items:flex-start;

            margin-bottom:35px;
        }

        .top-bar h1{

            font-size:90px;
            font-weight:800;

            color:#0f172a;
        }

        .top-bar p{

            margin-top:10px;

            font-size:24px;

            color:#666;
        }

        .back-btn{

            text-decoration:none;

            background:#2f63ea;

            color:white;

            padding:18px 32px;

            border-radius:18px;

            font-size:22px;
            font-weight:600;

            transition:0.3s;
        }

        .back-btn:hover{

            background:#1d4ed8;
        }

        /* PRODUCT HEADER */

        .product-header{

            background:white;

            border-radius:35px;

            padding:45px;

            display:flex;
            align-items:center;
            gap:45px;

            margin-bottom:45px;
        }

        .main-product-image{

            width:180px;
            height:180px;

            object-fit:contain;
        }

        .product-info{

            flex:1;
        }

        .product-title{

            font-size:58px;

            font-weight:800;

            color:#0f172a;

            line-height:1.15;

            margin-bottom:16px;
        }

        .product-subtitle{

            font-size:26px;

            color:#666;
        }

        /* RESULTS */

        .results-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(320px,1fr));

            gap:35px;
        }

        .result-card{

            background:white;

            border-radius:30px;

            padding:40px 30px;

            text-align:center;

            transition:0.3s;
        }

        .result-card:hover{

            transform:translateY(-6px);

            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .website-logo{

            width:90px;
            height:90px;

            object-fit:contain;

            margin-bottom:25px;
        }

        .result-card h3{

            font-size:38px;

            text-transform:capitalize;

            color:#0f172a;

            margin-bottom:25px;
        }

        .price{

            font-size:68px;

            font-weight:800;

            color:#16a34a;

            margin-bottom:30px;
        }

        .visit-btn{

            display:inline-block;

            text-decoration:none;

            background:#2f63ea;

            color:white;

            padding:18px 35px;

            border-radius:18px;

            font-size:24px;
            font-weight:600;

            transition:0.3s;
        }

        .visit-btn:hover{

            background:#1d4ed8;
        }

        .not-found{

            background:#ffe3e3;

            color:#dc2626;

            padding:22px;

            border-radius:18px;

            font-size:30px;
            font-weight:700;
        }

        /* LOADING SCREEN */

        .loading-screen{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100vh;

            background:rgba(244,245,251,0.96);

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            z-index:9999;
        }

        .loader{

            width:90px;
            height:90px;

            border:8px solid #dbe4ff;

            border-top:8px solid #2f63ea;

            border-radius:50%;

            animation:spin 1s linear infinite;

            margin-bottom:25px;
        }

        .loading-screen h2{

            font-size:42px;

            color:#0f172a;

            margin-bottom:10px;
        }

        .loading-screen p{

            font-size:22px;

            color:#666;
        }

        @keyframes spin{

            0%{

                transform:rotate(0deg);
            }

            100%{

                transform:rotate(360deg);
            }
        }

        /* MOBILE */

        @media(max-width:768px){

            body{

                padding:20px;
            }

            .top-bar{

                flex-direction:column;
                gap:20px;
            }

            .top-bar h1{

                font-size:52px;
            }

            .product-header{

                flex-direction:column;
                text-align:center;
            }

            .product-title{

                font-size:38px;
            }

            .price{

                font-size:48px;
            }
        }

    </style>

</head>

<body>

    <!-- LOADING -->

    <div
        id="loadingScreen"
        class="loading-screen"
    >

        <div class="loader"></div>

        <h2>
            Please wait...
        </h2>

        <p>
            Loading comparison results
        </p>

    </div>

    <!-- TOP -->

    <div class="top-bar">

        <div>

            <h1>
                Comparison Results
            </h1>

            <p>
                Best prices found across 6 websites
            </p>

        </div>

        <a
            href="./dashboard.html"
            class="back-btn"
        >
            ← Back
        </a>

    </div>

    <!-- PRODUCT HEADER -->

    <div
        class="product-header"
        id="productHeader"
    >

    </div>

    <!-- RESULTS -->

    <div
        class="results-grid"
        id="resultsContainer"
    >

    </div>

<script>

    /* WEBSITE LOGOS */

    const websiteLogos = {

        amazon:
        "https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg",

        flipkart:
        "https://upload.wikimedia.org/wikipedia/commons/e/e5/Flipkart_logo_%282026%29.svg",

        bigbasket:
        "https://upload.wikimedia.org/wikipedia/commons/a/a2/BigBasket_Logo.png",

        blinkit:
        "https://upload.wikimedia.org/wikipedia/commons/2/2f/Blinkit-yellow-app-icon.svg",

        nike:
        "https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg",

        adidas:
        "https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg"
    };

    /* DOM */

    const loadingScreen =
    document.getElementById("loadingScreen");

    const productHeader =
    document.getElementById("productHeader");

    const resultsContainer =
    document.getElementById("resultsContainer");

    /* URL PARAMS */

    const urlParams =
    new URLSearchParams(window.location.search);

    const product =
    urlParams.get("product") ||
    urlParams.get("url");

    /* DYNAMIC LOADER */

    const loadingMessages = [

        "🔍 Searching Amazon...",
        "🛒 Searching Flipkart...",
        "🥬 Searching BigBasket...",
        "⚡ Comparing Prices...",
        "🤖 AI Analysing Best Deals..."
    ];

    let loadingIndex = 0;

    const loadingInterval = setInterval(()=>{

        loadingScreen.innerHTML =

        `
        <div class="loader"></div>

        <h2>

            ${loadingMessages[loadingIndex]}

        </h2>

        <p>

            Please wait while we scrape
            products from multiple websites

        </p>
        `;

        loadingIndex++;

        if(
            loadingIndex >=
            loadingMessages.length
        ){

            loadingIndex = 0;
        }

    },1200);

    async function loadResults(){

        try{

            if(!product){

                clearInterval(loadingInterval);

                loadingScreen.style.display =
                "none";

                resultsContainer.innerHTML =

                `
                <div class="not-found">
                    No product specified
                </div>
                `;

                return;
            }

            loadingScreen.style.display =
            "flex";

            /* API CALL */

            const response =
            await fetch(

                "http://localhost:8000/api/products/search",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        product:product
                    })
                }
            );

            const data =
            await response.json();

            console.log(data);

            if(
                !data ||
                !Array.isArray(data.results)
            ){

                throw new Error(
                    "Invalid API response"
                );
            }

            const results =
            data.results || [];

            /* PRODUCT HEADER */

            const firstValid =
            results.find(item => item?.image);

            const image =
            firstValid?.image ||
            "https://via.placeholder.com/200";

            productHeader.innerHTML =

            `
            <img
                src="${image}"
                class="main-product-image"
            >

            <div class="product-info">

                <h2 class="product-title">

                    ${product}

                </h2>

                <p class="product-subtitle">

                    Live comparison across
                    multiple websites

                </p>

                ${
                    data.aiData?.ai

                    ?

                    `
                    <div

                        style="
                            margin-top:20px;
                            display:inline-block;
                            background:#7c3aed;
                            color:white;
                            padding:12px 20px;
                            border-radius:999px;
                            font-size:18px;
                            font-weight:700;
                        "
                    >

                        🤖 AI Recommended Search

                    </div>
                    `

                    :

                    ""
                }

            </div>
            `;

            /* FIND BEST DEAL */

            const validResults =
            results.filter(item => {

                if(!item?.price){

                    return false;
                }

                const numeric =
                parseInt(

                    String(item.price)
                    .replace(/[^\d]/g,"")
                );

                return !isNaN(numeric);
            });

            let lowestPrice = Infinity;

            validResults.forEach(item => {

                const numeric =
                parseInt(

                    String(item.price)
                    .replace(/[^\d]/g,"")
                );

                if(numeric < lowestPrice){

                    lowestPrice = numeric;
                }
            });

            /* RENDER RESULTS */

            resultsContainer.innerHTML =

            results.map(item => {

                const websiteName =
                (
                    item?.website ||
                    "amazon"
                ).toLowerCase();

                const logo =
                websiteLogos[websiteName] ||
                websiteLogos.amazon;

                let numericPrice = NaN;

                if(item?.price){

                    numericPrice =
                    parseInt(

                        String(item.price)
                        .replace(/[^\d]/g,"")
                    );
                }

                const isBestDeal =
                numericPrice === lowestPrice;

                return `

                <div
                    class="result-card"

                    style="
                        ${
                            isBestDeal

                            ?

                            `
                            border:4px solid #16a34a;
                            box-shadow:
                            0 0 30px rgba(22,163,74,0.3);
                            position:relative;
                            `

                            :

                            ""
                        }
                    "
                >

                    ${
                        isBestDeal

                        ?

                        `
                        <div

                            style="
                                position:absolute;
                                top:-15px;
                                right:20px;
                                background:#16a34a;
                                color:white;
                                padding:10px 18px;
                                border-radius:999px;
                                font-size:18px;
                                font-weight:700;
                            "
                        >

                            🏆 Best Deal

                        </div>
                        `

                        :

                        ""
                    }

                    <img
                        src="${logo}"
                        class="website-logo"
                    >

                    <h3>

                        ${item?.website || "Amazon"}

                    </h3>

                    ${
                        item?.found

                        ?

                        `
                        <div class="price">

                            ${item.price}

                        </div>

                        <a
                            href="${item.url}"

                            target="_blank"

                            class="visit-btn"
                        >
                            Visit Product
                        </a>
                        `

                        :

                        `
                        <div class="not-found">

                            ✕ Product Not Found

                        </div>
                        `
                    }

                </div>
                `;
            }).join("");

            clearInterval(loadingInterval);

            loadingScreen.style.display =
            "none";
        }

        catch(error){

            clearInterval(loadingInterval);

            console.log(error);

            loadingScreen.innerHTML =

            `
            <h2 style="color:red;">
                Backend Error
            </h2>

            <p style="margin-top:20px;">
                ${error.message}
            </p>
            `;
        }
    }

    loadResults();

</script>

</body>

</html>
