<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Review Checker
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f5fb;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;
        }

        .container{

            width:100%;
            max-width:950px;

            background:white;

            border-radius:30px;

            padding:50px;

            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .top{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:40px;
        }

        .back-btn{

            text-decoration:none;

            background:#2f63ea;
            color:white;

            padding:14px 24px;

            border-radius:14px;

            font-size:18px;
            font-weight:600;

            transition:0.3s;
        }

        .back-btn:hover{

            background:#1d4ed8;
        }

        h1{

            font-size:56px;

            margin-bottom:12px;

            color:#111;
        }

        .subtitle{

            font-size:22px;

            color:#666;

            margin-bottom:35px;
        }

        .search-box{

            display:flex;
            gap:15px;

            margin-bottom:40px;
        }

        .search-box input{

            flex:1;

            padding:18px 22px;

            border:none;

            outline:none;

            border-radius:18px;

            background:#f4f5fb;

            font-size:18px;
        }

        .search-box button{

            background:#2f63ea;

            color:white;

            border:none;

            padding:0 30px;

            border-radius:18px;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        .search-box button:hover{

            background:#1d4ed8;
        }

        .result-card{

            background:#f8f9ff;

            border-radius:24px;

            padding:35px;

            display:flex;
            align-items:center;
            gap:30px;

            margin-bottom:30px;
        }

        .score-circle{

            width:140px;
            height:140px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            position:relative;

            flex-shrink:0;
        }

        .score-circle::before{

            content:"";

            position:absolute;

            width:100px;
            height:100px;

            background:white;

            border-radius:50%;
        }

        .score{

            position:relative;

            font-size:30px;
            font-weight:700;

            color:#111;
        }

        .result-content h2{

            font-size:36px;

            margin-bottom:12px;
        }

        .result-content p{

            font-size:20px;

            color:#666;

            line-height:1.6;
        }

        .badge{

            margin-top:18px;

            display:inline-block;

            padding:10px 18px;

            border-radius:12px;

            font-size:16px;
            font-weight:600;
        }

        .trusted{

            background:#dff7e6;
            color:#1e9b4f;
        }

        .fake{

            background:#ffe1e1;
            color:#e53935;
        }

        .loading{

            text-align:center;

            padding:30px;

            font-size:22px;

            color:#2f63ea;

            display:none;
        }

        .review-list{

            margin-top:20px;

            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .review-item{

            background:#f8f9ff;

            padding:22px;

            border-radius:18px;
        }

        .review-top{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:12px;
        }

        .review-score{

            font-size:15px;
            font-weight:700;

            padding:8px 14px;

            border-radius:10px;
        }

        .real{

            background:#dff7e6;
            color:#1e9b4f;
        }

        .spam{

            background:#ffe1e1;
            color:#e53935;
        }

        .review-text{

            font-size:17px;

            color:#444;

            line-height:1.6;
        }

        @media(max-width:768px){

            .container{

                padding:30px;
            }

            h1{

                font-size:40px;
            }

            .result-card{

                flex-direction:column;
                text-align:center;
            }

            .search-box{

                flex-direction:column;
            }

            .search-box button{

                height:55px;
            }

            .review-top{

                flex-direction:column;
                align-items:flex-start;
                gap:10px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="top">

            <div>

                <h1>
                    AI Review Checker
                </h1>

                <p class="subtitle">
                    Paste Amazon / Flipkart product URL to analyze reviews.
                </p>

            </div>

            <a
            href="./dashboard.html"
            class="back-btn"
            >
                ← Back
            </a>

        </div>

        <!-- SEARCH -->

        <div class="search-box">

            <input
            type="text"
            id="reviewUrl"
            placeholder="Paste product URL..."
            >

            <button id="analyzeBtn">

                Analyze

            </button>

        </div>

        <!-- LOADING -->

        <div class="loading"
            id="loading">

            🤖 AI analyzing reviews...

        </div>

        <!-- RESULT -->

        <div
            class="result-card"
            id="resultCard"
            style="display:none;"
        >

            <div
                class="score-circle"
                id="scoreCircle"
            >

                <div
                    class="score"
                    id="scoreText"
                >
                    0%
                </div>

            </div>

            <div class="result-content">

                <h2
                    id="resultTitle"
                >
                    Reviews Analysis
                </h2>

                <p
                    id="resultDescription"
                >
                    AI analysis completed.
                </p>

                <div
                    class="badge trusted"
                    id="resultBadge"
                >
                    ✓ Trusted Reviews
                </div>

            </div>

        </div>

        <!-- REVIEWS -->

        <div
            class="review-list"
            id="reviewList"
        >

        </div>

    </div>

    <script>

        const analyzeBtn =
        document.getElementById("analyzeBtn");

        const loading =
        document.getElementById("loading");

        const resultCard =
        document.getElementById("resultCard");

        const scoreCircle =
        document.getElementById("scoreCircle");

        const scoreText =
        document.getElementById("scoreText");

        const resultTitle =
        document.getElementById("resultTitle");

        const resultDescription =
        document.getElementById("resultDescription");

        const resultBadge =
        document.getElementById("resultBadge");

        const reviewList =
        document.getElementById("reviewList");

        analyzeBtn.addEventListener(

            "click",

            async()=>{

                const url =
                document
                .getElementById("reviewUrl")
                .value;

               if(!url){

    alert(
        "Please paste a product URL"
    );

    return;
}

const validUrlPattern =

/^(https?:\/\/)(www\.)?(amazon|flipkart)/i;

if(!validUrlPattern.test(url)){

    alert(
        "Please enter a valid Amazon or Flipkart product URL"
    );

    return;
}

                loading.style.display =
                "block";

                resultCard.style.display =
                "none";

                reviewList.innerHTML = "";

                try{

                    const response =
                    await fetch(

                        "http://localhost:8000/api/reviews/check",

                        {

                            method:"POST",

                            headers:{
                                "Content-Type":
                                "application/json"
                            },

                            body:JSON.stringify({

                                productUrl:url
                            })
                        }
                    );

                    const data =
                    await response.json();

                    loading.style.display =
                    "none";

                    resultCard.style.display =
                    "flex";

                    const percentage =
                    Math.round(

                        data.analysis
                        .overall_fake_percentage
                    );

                    scoreText.innerText =
                    `${percentage}%`;

                    scoreCircle.style.background =

                    `conic-gradient(
                        ${
                            percentage > 50
                            ?
                            "#ef4444"
                            :
                            "#2f63ea"
                        }
                        0%
                        ${percentage}%,

                        #dfe4ff
                        ${percentage}% 100%
                    )`;

                    if(percentage > 50){

                        resultTitle.innerText =
                        "High Fake Review Probability";

                        resultDescription.innerText =

                        "AI detected suspicious review patterns, repetitive wording and spam-like behavior.";

                        resultBadge.innerText =
                        "⚠ Suspicious Reviews";

                        resultBadge.className =
                        "badge fake";
                    }

                    else{

                        resultTitle.innerText =
                        "Reviews Mostly Authentic";

                        resultDescription.innerText =

                        "AI detected low spam probability and genuine customer engagement patterns.";

                        resultBadge.innerText =
                        "✓ Trusted Product Reviews";

                        resultBadge.className =
                        "badge trusted";
                    }

                    data.analysis.reviews
                    .forEach(review => {

                        const isFake =
                        review.fake_probability > 50;

                        reviewList.innerHTML +=

                        `
                        <div class="review-item">

                            <div class="review-top">

                                <strong>
                                    Review Analysis
                                </strong>

                                <div class="review-score ${isFake ? "spam" : "real"}">

                                    ${
                                        isFake
                                        ?
                                        "⚠ Fake"
                                        :
                                        "✓ Genuine"
                                    }

                                    -
                                    ${review.fake_probability}%

                                </div>

                            </div>

                            <div class="review-text">

                                ${review.review}

                            </div>

                        </div>
                        `;
                    });

                }

                catch(error){

                    loading.style.display =
                    "none";

                    alert(
                        "Backend Error"
                    );

                    console.log(error);
                }
            }
        );

    </script>

</body>

</html>
