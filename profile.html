<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f3f4f8;
            color:#111827;

            min-height:100vh;
        }

        .container{

            display:flex;
            min-height:100vh;
        }

.sidebar{

    width:260px;
    background:white;

    padding:30px 25px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:0 2px 12px rgba(0,0,0,0.05);

    position:fixed;

    top:0;
    left:0;

    height:100vh;

    overflow:hidden;
}


        .logo{

            font-size:34px;
            font-weight:800;

            color:#2563eb;

            margin-bottom:50px;
        }

        .sidebar-links{

            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .sidebar-links button{

            border:none;
            background:transparent;

            text-align:left;

            font-size:18px;
            font-weight:700;

            padding:12px 0;

            cursor:pointer;

            color:#111827;

            transition:0.3s;
        }

        .sidebar-links button:hover{

            color:#2563eb;
            transform:translateX(5px);
        }

        .logout-btn{

            background:#ff4d4d;
            color:white;

            border:none;

            height:58px;

            border-radius:18px;

            font-size:20px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .logout-btn:hover{

            background:#e53935;
        }

.main-content{

    flex:1;

    padding:30px;

    margin-left:260px;
}

        .top-bar{

            display:flex;
            justify-content:flex-end;
            align-items:center;

            margin-bottom:30px;
        }

        .profile-img{

            width:80px;
            height:80px;

            border-radius:50%;

            object-fit:cover;

            border:4px solid white;

            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-card{

            background:white;

            border-radius:35px;

            padding:40px;

            margin-bottom:30px;

            box-shadow:0 5px 25px rgba(0,0,0,0.05);
        }

        .profile-header{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:35px;
        }

        .profile-header h1{

            font-size:60px;
            font-weight:900;
        }

        .save-btn{

            border:none;

            background:#2563eb;
            color:white;

            padding:18px 35px;

            border-radius:18px;

            font-size:18px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .save-btn:hover{

            background:#1e40af;
        }

        .profile-grid{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .input-group{

            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .input-group label{

            font-size:18px;
            font-weight:700;
        }

        .input-group input{

            height:65px;

            border:none;

            background:#f3f4f8;

            border-radius:18px;

            padding:0 20px;

            font-size:18px;
        }

        .input-group input:focus{

            outline:none;
            border:2px solid #2563eb;
        }

        .activity-card{

            background:white;

            border-radius:35px;

            padding:40px;

            box-shadow:0 5px 25px rgba(0,0,0,0.05);
        }

        .activity-card h2{

            font-size:48px;
            font-weight:900;

            margin-bottom:35px;
        }

        .stats-grid{

            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:25px;
        }

        .stat-box{

            background:#f3f4f8;

            border-radius:30px;

            padding:35px;

            transition:0.3s;
        }

        .stat-box:hover{

            transform:translateY(-5px);
        }

        .stat-icon{

            width:65px;
            height:65px;

            border-radius:20px;

            background:#dbeafe;

            color:#2563eb;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:28px;

            margin-bottom:25px;
        }

        .stat-box h3{

            font-size:52px;
            font-weight:900;

            margin-bottom:10px;
        }

        .stat-box p{

            font-size:22px;
            color:#64748b;
        }

        @media(max-width:1000px){

            .container{

                flex-direction:column;
            }

            .sidebar{

                width:100%;
            }

            .profile-grid{

                grid-template-columns:1fr;
            }

            .stats-grid{

                grid-template-columns:1fr;
            }

            .profile-header{

                flex-direction:column;
                gap:20px;
                align-items:flex-start;
            }

            .profile-header h1{

                font-size:42px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="sidebar">

            <div>

                <div class="logo">

                    JerseyScout

                </div>

                <div class="sidebar-links">

                    <button
                        onclick="window.location.href='dashboard.html'">

                        Dashboard

                    </button>

                    <button
                        onclick="window.location.href='review-checker.html'">

                        AI Review

                    </button>

                    <button
                        onclick="window.location.href='wishlist.html'">

                        Wishlist

                    </button>

                </div>

            </div>

            <button class="logout-btn"
                onclick="window.location.href='index.html'">

                Logout

            </button>

        </div>

        <div class="main-content">

            <div class="top-bar">

                <img class="profile-img"
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=500&auto=format&fit=crop">

            </div>

            <div class="profile-card">

                <div class="profile-header">

                    <h1>

                        Edit Profile

                    </h1>

                    <button class="save-btn">

                        Save Changes

                    </button>

                </div>

                <div class="profile-grid">

                    <div class="input-group">

                        <label>

                            Full Name

                        </label>

                        <input type="text"
                            value="John Doe">

                    </div>

                    <div class="input-group">

                        <label>

                            Email Address

                        </label>

                        <input type="email"
                            value="john@gmail.com">

                    </div>

                    <div class="input-group">

                        <label>

                            Phone Number

                        </label>

                        <input type="text"
                            value="+91 9876543210">

                    </div>

                    <div class="input-group">

                        <label>

                            City

                        </label>

                        <input type="text"
                            value="Mumbai">

                    </div>

                </div>

            </div>

            <div class="activity-card">

                <h2>

                    Your Activity

                </h2>

                <div class="stats-grid">

                    <div class="stat-box">

                        <div class="stat-icon">

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </div>

                        <h3>

                            128

                        </h3>

                        <p>

                            Products Compared

                        </p>

                    </div>

                    <div class="stat-box">

                        <div class="stat-icon">

                            <i class="fa-solid fa-heart"></i>

                        </div>

                        <h3>

                            24

                        </h3>

                        <p>

                            Wishlist Items

                        </p>

                    </div>

                    <div class="stat-box">

                        <div class="stat-icon">

                            <i class="fa-solid fa-wallet"></i>

                        </div>

                        <h3>

                            ₹12K

                        </h3>

                        <p>

                            Total Savings

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
